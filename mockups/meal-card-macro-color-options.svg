<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 700" width="706" height="700">
  <!-- background -->
  <rect width="706" height="700" fill="#0a0814"/>

  <defs>
    <!-- reusable star icon, radius 9 -->
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0,-9 L2.6,-3.2 L9,-2.8 L4,1.5 L6,8.5 L0,4.5 L-6,8.5 L-4,1.5 L-9,-2.8 L-2.6,-3.2 Z" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <!-- 3 vertical dots -->
    <symbol id="dots" viewBox="-3 -10 6 20">
      <circle cx="0" cy="-7" r="1.8" fill="#9ca3af"/>
      <circle cx="0" cy="0" r="1.8" fill="#9ca3af"/>
      <circle cx="0" cy="7" r="1.8" fill="#9ca3af"/>
    </symbol>
  </defs>

  <!-- =========================================================== -->
  <!-- OPTION A — colored labels only (P violet, kcal amber)        -->
  <!-- =========================================================== -->
  <g transform="translate(0, 0)">
    <text x="353" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="2">OPTION A — COLORED LABELS</text>

    <rect x="20" y="35" width="666" height="170" rx="24" fill="#1a1633"/>
    <rect x="20" y="35" width="666" height="170" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>

    <text x="45" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">BREAKFAST</text>
    <text x="45" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="white">Desayuno: pan + bananabread</text>

    <use href="#star" x="603" y="78" width="20" height="20"/>
    <use href="#dots" x="643" y="78" width="6" height="20"/>

    <!-- macros: "P 59.2g · 714 kcal" -->
    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- P prefix in violet -->
      <text x="45" y="170" font-size="22" font-weight="700" fill="#a78bfa">P</text>
      <!-- 59.2 white -->
      <text x="72" y="178" font-size="38" font-weight="800" fill="white">59.2</text>
      <text x="172" y="178" font-size="15" font-weight="500" fill="#9ca3af">g</text>
      <!-- separator -->
      <text x="200" y="172" font-size="22" font-weight="800" fill="#6b7280">·</text>
      <!-- 714 white -->
      <text x="225" y="178" font-size="38" font-weight="800" fill="white">714</text>
      <!-- kcal suffix in amber -->
      <text x="312" y="178" font-size="15" font-weight="500" fill="#f59e0b">kcal</text>
    </g>

    <!-- handle bar -->
    <rect x="328" y="193" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- =========================================================== -->
  <!-- OPTION B — full block colored (whole P xg violet, kcal amber)-->
  <!-- =========================================================== -->
  <g transform="translate(0, 240)">
    <text x="353" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="2">OPTION B — FULL BLOCK COLORED</text>

    <rect x="20" y="35" width="666" height="170" rx="24" fill="#1a1633"/>
    <rect x="20" y="35" width="666" height="170" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>

    <text x="45" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">BREAKFAST</text>
    <text x="45" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="white">Desayuno: pan + bananabread</text>

    <use href="#star" x="603" y="78" width="20" height="20"/>
    <use href="#dots" x="643" y="78" width="6" height="20"/>

    <!-- macros: all "P 59.2g" violet, all "714 kcal" amber -->
    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="45" y="170" font-size="22" font-weight="700" fill="#a78bfa">P</text>
      <text x="72" y="178" font-size="38" font-weight="800" fill="#a78bfa">59.2</text>
      <text x="172" y="178" font-size="15" font-weight="500" fill="#a78bfa">g</text>
      <text x="200" y="172" font-size="22" font-weight="800" fill="#6b7280">·</text>
      <text x="225" y="178" font-size="38" font-weight="800" fill="#f59e0b">714</text>
      <text x="312" y="178" font-size="15" font-weight="500" fill="#f59e0b">kcal</text>
    </g>

    <rect x="328" y="193" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- =========================================================== -->
  <!-- OPTION C — stacked on two lines                              -->
  <!-- =========================================================== -->
  <g transform="translate(0, 480)">
    <text x="353" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="2">OPTION C — STACKED ROWS</text>

    <rect x="20" y="35" width="666" height="200" rx="24" fill="#1a1633"/>
    <rect x="20" y="35" width="666" height="200" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>

    <text x="45" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">BREAKFAST</text>
    <text x="45" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="white">Desayuno: pan + bananabread</text>

    <use href="#star" x="603" y="78" width="20" height="20"/>
    <use href="#dots" x="643" y="78" width="6" height="20"/>

    <!-- row 1: protein in violet -->
    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="45" y="158" font-size="18" font-weight="700" fill="#a78bfa">P</text>
      <text x="68" y="165" font-size="30" font-weight="800" fill="#a78bfa">59.2</text>
      <text x="148" y="165" font-size="13" font-weight="500" fill="#a78bfa">g</text>
    </g>
    <!-- row 2: kcal in amber -->
    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="45" y="210" font-size="30" font-weight="800" fill="#f59e0b">714</text>
      <text x="116" y="210" font-size="13" font-weight="500" fill="#f59e0b">kcal</text>
    </g>

    <rect x="328" y="223" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
  </g>
</svg>
