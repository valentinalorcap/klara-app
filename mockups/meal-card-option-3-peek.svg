<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 380" width="690" height="380">
  <rect width="690" height="380" fill="#0a0814"/>

  <defs>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15102b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#15102b" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="15" y="15" width="660" height="350" rx="24" fill="#15102b"/>
  <rect x="15" y="15" width="660" height="350" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>
  <line x1="35" y1="16.5" x2="655" y2="16.5" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- BREAKFAST label -->
  <text x="40" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">BREAKFAST</text>

  <!-- title -->
  <text x="40" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="white">Desayuno: pan + bananabread</text>

  <!-- star -->
  <g transform="translate(595, 55)">
    <path d="M0,-9 L2.6,-3.2 L9,-2.8 L4,1.5 L6,8.5 L0,4.5 L-6,8.5 L-4,1.5 L-9,-2.8 L-2.6,-3.2 Z" fill="#facc15"/>
  </g>

  <!-- vertical 3 dots -->
  <g transform="translate(635, 55)" fill="#9ca3af">
    <circle cy="-7" r="1.8"/>
    <circle cy="0" r="1.8"/>
    <circle cy="7" r="1.8"/>
  </g>

  <!-- macros -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="165" font-size="40" font-weight="800" fill="white">55.5</text>
    <text x="142" y="165" font-size="15" font-weight="500" fill="#9ca3af">g P</text>
    <text x="185" y="158" font-size="22" font-weight="800" fill="#6b7280">·</text>
    <text x="215" y="165" font-size="40" font-weight="800" fill="white">661</text>
    <text x="315" y="165" font-size="15" font-weight="500" fill="#9ca3af">kcal</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="205" x2="650" y2="205" stroke="rgba(255,255,255,0.06)"/>

  <!-- ingredient peek lines, fading down -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <g opacity="0.75">
      <text x="40" y="235" fill="#d4d4d8">Pan integral</text>
      <text x="160" y="235" fill="#737373">60g</text>
      <text x="650" y="235" fill="#737373" text-anchor="end">P 4.8g · 165 kcal</text>
    </g>
    <g opacity="0.45">
      <text x="40" y="265" fill="#d4d4d8">Banana bread</text>
      <text x="178" y="265" fill="#737373">80g</text>
      <text x="650" y="265" fill="#737373" text-anchor="end">P 3.2g · 220 kcal</text>
    </g>
    <g opacity="0.20">
      <text x="40" y="295" fill="#d4d4d8">Mantequilla de maní</text>
      <text x="225" y="295" fill="#737373">15g</text>
      <text x="650" y="295" fill="#737373" text-anchor="end">P 3.7g · 88 kcal</text>
    </g>
  </g>

  <!-- fade overlay at bottom (suggests more content) -->
  <rect x="15" y="290" width="660" height="75" rx="0" fill="url(#cardFade)"/>

  <!-- label tag -->
  <text x="345" y="370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#525252" text-anchor="middle" letter-spacing="1">OPTION 3 — INGREDIENT PEEK</text>
</svg>
